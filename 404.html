<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#030712">
  <title>404 ARCHIVE NOT FOUND - VOICE VISUAL NOVELS</title>
  <meta name="description" content="指定された電脳アーカイブ・アドレスは存在しないか、通信プロトコルが無効です。">
  <meta name="robots" content="noindex, follow">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Orbitron:wght@700;800;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #030712;
      --card-bg: rgba(15, 23, 42, 0.85);
      --neon-cyan: #00f3ff;
      --neon-alert: #f43f5e;
      --neon-mint: #2dd4bf;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --font-logo: 'Orbitron', sans-serif;
      --font-hud: 'Chakra Petch', sans-serif;
      --font-body: 'Noto Sans JP', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(244, 63, 94, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(0, 243, 255, 0.08) 0%, transparent 50%);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    /* 背景サイバーグリッド */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      pointer-events: none;
      z-index: 0;
    }

    .error-card {
      position: relative;
      z-index: 1;
      max-width: 600px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid rgba(244, 63, 94, 0.35);
      border-radius: 16px;
      padding: 48px 36px;
      text-align: center;
      box-shadow: 0 0 40px rgba(244, 63, 94, 0.15), 0 20px 40px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .badge-error {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-hud);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--neon-alert);
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid var(--neon-alert);
      padding: 6px 16px;
      border-radius: 30px;
      margin-bottom: 24px;
      box-shadow: 0 0 15px rgba(244, 63, 94, 0.3);
    }

    .error-code {
      font-family: var(--font-logo);
      font-size: clamp(4rem, 15vw, 6.5rem);
      font-weight: 900;
      line-height: 1;
      color: #fff;
      text-shadow: 0 0 20px rgba(244, 63, 94, 0.6), 0 0 40px rgba(0, 243, 255, 0.4);
      margin-bottom: 12px;
      letter-spacing: 0.05em;
    }

    .error-title {
      font-family: var(--font-hud);
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--neon-alert);
      letter-spacing: 0.1em;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .error-desc {
      font-size: 0.95rem;
      color: var(--text-sub);
      line-height: 1.8;
      margin-bottom: 36px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    @media (min-width: 480px) {
      .btn-group {
        flex-direction: row;
        justify-content: center;
      }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: var(--font-hud);
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-decoration: none;
      padding: 14px 24px;
      border-radius: 8px;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #00f3ff);
      color: #030712;
      border: 1px solid var(--neon-cyan);
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.35);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.6);
      filter: brightness(1.1);
    }

    .btn-secondary {
      background: rgba(15, 23, 42, 0.8);
      color: var(--text-main);
      border: 1px solid rgba(148, 163, 184, 0.3);
    }
    .btn-secondary:hover {
      background: rgba(30, 41, 59, 0.9);
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
      transform: translateY(-2px);
    }

    .status-terminal {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-family: var(--font-hud);
      font-size: 0.75rem;
      color: #64748b;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>

  <div class="error-card">
    <div class="badge-error">
      <span>●</span> PROTOCOL ANOMALY DETECTED
    </div>

    <div class="error-code">404</div>
    <div class="error-title">ARCHIVE SECTOR NOT FOUND</div>

    <p class="error-desc">
      アクセス要求された暗号化ノードは存在しないか、権限により隔離・消去されています。<br>
      URLをご確認いただくか、公式ポータルより再接続してください。
    </p>

    <div class="btn-group">
      <a href="https://aegisfleet.github.io/voice-visual-novel/" class="btn btn-primary">
        🏠 ポータル（作品一覧）へ戻る
      </a>
      <a href="https://aegisfleet.github.io/voice-visual-novel/eve/" class="btn btn-secondary">
        🎮 『PROJECT EVE』を起動
      </a>
    </div>

    <div class="status-terminal">
      SYSTEM STATUS: SECURE PURGE ACTIVE // CODE 0x404_VOID // AEGIS FORENSICS
    </div>
  </div>
</body>
</html>
