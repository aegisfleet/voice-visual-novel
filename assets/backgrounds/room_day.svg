<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#70c4ff"/>
      <stop offset="100%" stop-color="#bfe6ff"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="100%" stop-color="#f0e4d4"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c89d70"/>
      <stop offset="100%" stop-color="#a4774e"/>
    </linearGradient>
    <linearGradient id="sunbeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.0)"/>
    </linearGradient>
  </defs>

  <!-- Wall -->
  <rect x="0" y="0" width="1920" height="780" fill="url(#wallGrad)"/>

  <!-- Window Frame -->
  <rect x="250" y="100" width="550" height="520" rx="10" fill="#7d6148"/>
  <rect x="270" y="120" width="510" height="480" rx="6" fill="url(#skyGrad)"/>

  <!-- Clouds -->
  <ellipse cx="420" cy="240" rx="80" ry="35" fill="rgba(255,255,255,0.7)"/>
  <ellipse cx="480" cy="230" rx="60" ry="30" fill="rgba(255,255,255,0.85)"/>
  <ellipse cx="620" cy="300" rx="90" ry="40" fill="rgba(255,255,255,0.6)"/>

  <!-- Window Pane cross -->
  <rect x="520" y="120" width="10" height="480" fill="#7d6148"/>
  <rect x="270" y="350" width="510" height="10" fill="#7d6148"/>

  <!-- Sunbeam overlay -->
  <polygon points="270,120 780,120 1350,1080 350,1080" fill="url(#sunbeam)"/>

  <!-- Baseboard -->
  <rect x="0" y="760" width="1920" height="25" fill="#845e3d"/>

  <!-- Floor -->
  <rect x="0" y="785" width="1920" height="295" fill="url(#floorGrad)"/>

  <!-- Floor planks lines -->
  <line x1="0" y1="840" x2="1920" y2="840" stroke="#875f3b" stroke-width="2" opacity="0.6"/>
  <line x1="0" y1="910" x2="1920" y2="910" stroke="#875f3b" stroke-width="2" opacity="0.6"/>
  <line x1="0" y1="990" x2="1920" y2="990" stroke="#875f3b" stroke-width="2" opacity="0.6"/>
</svg>
