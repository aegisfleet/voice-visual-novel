<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="sunsetSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a2545"/>
      <stop offset="40%" stop-color="#c14953"/>
      <stop offset="75%" stop-color="#e08dac"/>
      <stop offset="100%" stop-color="#f4b266"/>
    </linearGradient>
    <linearGradient id="sunsetWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6a3e51"/>
      <stop offset="100%" stop-color="#552c3c"/>
    </linearGradient>
    <linearGradient id="sunsetFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#58312b"/>
      <stop offset="100%" stop-color="#3d201c"/>
    </linearGradient>
    <linearGradient id="sunsetLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(244, 178, 102, 0.45)"/>
      <stop offset="100%" stop-color="rgba(244, 178, 102, 0.0)"/>
    </linearGradient>
  </defs>

  <!-- Wall -->
  <rect x="0" y="0" width="1920" height="780" fill="url(#sunsetWall)"/>

  <!-- Window Frame -->
  <rect x="250" y="100" width="550" height="520" rx="10" fill="#38211b"/>
  <rect x="270" y="120" width="510" height="480" rx="6" fill="url(#sunsetSky)"/>

  <!-- Window Pane cross -->
  <rect x="520" y="120" width="10" height="480" fill="#38211b"/>
  <rect x="270" y="350" width="510" height="10" fill="#38211b"/>

  <!-- Sunset beam overlay -->
  <polygon points="270,120 780,120 1350,1080 350,1080" fill="url(#sunsetLight)"/>

  <!-- Baseboard -->
  <rect x="0" y="760" width="1920" height="25" fill="#361a15"/>

  <!-- Floor -->
  <rect x="0" y="785" width="1920" height="295" fill="url(#sunsetFloor)"/>
</svg>
