<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="livingWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="woodFloor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="windowCurtain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>

  <!-- Living Room Wall -->
  <rect width="1920" height="760" fill="url(#livingWall)"/>

  <!-- Balcony Window & Curtains -->
  <rect x="250" y="80" width="600" height="600" fill="#bae6fd" stroke="#78350f" stroke-width="8"/>
  <rect x="230" y="70" width="100" height="620" fill="url(#windowCurtain)" opacity="0.85" rx="10"/>
  <rect x="770" y="70" width="100" height="620" fill="url(#windowCurtain)" opacity="0.85" rx="10"/>

  <!-- Floor -->
  <rect y="740" width="1920" height="340" fill="url(#woodFloor)"/>

  <!-- Living Sofa (Warm family home feel) -->
  <rect x="220" y="660" width="480" height="180" rx="20" fill="#fde68a" stroke="#d97706" stroke-width="4"/>
  <ellipse cx="360" cy="710" rx="90" ry="40" fill="#fef08a"/>
  <ellipse cx="540" cy="710" rx="90" ry="40" fill="#fef08a"/>

  <!-- Children's toys / Teddy bear on sofa (Family presence) -->
  <circle cx="280" cy="630" r="28" fill="#b45309"/>
  <circle cx="265" cy="610" r="10" fill="#b45309"/>
  <circle cx="295" cy="610" r="10" fill="#b45309"/>
  <ellipse cx="280" cy="650" rx="22" ry="26" fill="#b45309"/>

  <!-- Kid's Drawing on Wall ("家族の絵: 母、ユイ、ロボットのイブ") -->
  <rect x="920" y="140" width="220" height="170" fill="#ffffff" stroke="#f59e0b" stroke-width="6" rx="4"/>
  <circle cx="970" cy="210" r="14" fill="#f43f5e"/> <!-- Mother -->
  <circle cx="1020" cy="230" r="10" fill="#ec4899"/> <!-- Yui (Little girl) -->
  <rect x="1060" y="200" width="22" height="30" fill="#2dd4bf" rx="2"/> <!-- Robot Eve -->
  <line x1="970" y1="230" x2="1020" y2="245" stroke="#333" stroke-width="2"/>
  <line x1="1020" y1="245" x2="1060" y2="225" stroke="#333" stroke-width="2"/>
  <text x="1030" y="295" font-family="sans-serif" font-size="14" fill="#92400e" text-anchor="middle">だいすきな いぶへ</text>

  <!-- PC Desk with Router (Cyber crime source) -->
  <rect x="1220" y="580" width="480" height="220" rx="6" fill="#78350f"/>
  <rect x="1350" y="460" width="180" height="120" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <rect x="1560" y="530" width="60" height="50" rx="4" fill="#0f172a"/>
  <!-- Blinking network LED lights on router -->
  <circle cx="1580" cy="550" r="3" fill="#22c55e"/>
  <circle cx="1595" cy="550" r="3" fill="#ef4444"/>
  <circle cx="1610" cy="550" r="3" fill="#38bdf8"/>

  <!-- Medicine shelf / Thermometer near desk (Foreshadowing Yui's illness) -->
  <rect x="1230" y="320" width="160" height="180" fill="#fef3c7" stroke="#b45309" stroke-width="4"/>
  <rect x="1250" y="370" width="25" height="40" fill="#f43f5e" rx="4"/>
  <rect x="1290" y="360" width="30" height="50" fill="#3b82f6" rx="4"/>
  <rect x="1335" y="380" width="20" height="30" fill="#10b981" rx="4"/>
</svg>
