<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="interrogWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="interrogFloor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="lampCone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>

  <!-- Cold Concrete Wall -->
  <rect width="1920" height="780" fill="url(#interrogWall)"/>

  <!-- One-way Observation Mirror (Left) -->
  <rect x="180" y="140" width="460" height="420" rx="4" fill="#090d16" stroke="#475569" stroke-width="10"/>
  <line x1="210" y1="170" x2="610" y2="530" stroke="rgba(255,255,255,0.06)" stroke-width="12"/>

  <!-- Police Seal / Notice on Wall -->
  <rect x="1350" y="160" width="220" height="280" fill="#f8fafc" stroke="#64748b" stroke-width="4"/>
  <rect x="1370" y="180" width="180" height="30" fill="#dc2626"/>
  <text x="1460" y="202" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">警視庁 取調規定</text>
  <line x1="1380" y1="240" x2="1540" y2="240" stroke="#94a3b8" stroke-width="3"/>
  <line x1="1380" y1="270" x2="1540" y2="270" stroke="#94a3b8" stroke-width="3"/>
  <line x1="1380" y1="300" x2="1540" y2="300" stroke="#94a3b8" stroke-width="3"/>

  <!-- Cold Floor -->
  <rect y="760" width="1920" height="320" fill="url(#interrogFloor)"/>

  <!-- Hanging Fluorescent Lamp -->
  <rect x="955" y="0" x2="955" width="10" height="240" fill="#64748b"/>
  <rect x="880" y="240" width="160" height="25" rx="4" fill="#cbd5e1"/>
  <!-- Light cone downward -->
  <polygon points="960,265 650,1080 1270,1080" fill="url(#lampCone)"/>

  <!-- Interrogation Table in Foreground -->
  <polygon points="0,1080 320,740 1600,740 1920,1080" fill="#475569" stroke="#334155" stroke-width="4"/>
  <!-- Metal handcuffs / restraint on table edge (Robot lock) -->
  <ellipse cx="960" cy="800" rx="70" ry="24" fill="none" stroke="#94a3b8" stroke-width="8"/>
  <line x1="890" y1="800" x2="1030" y2="800" stroke="#94a3b8" stroke-width="6"/>

  <!-- Document Dossier / Police Folder on Table -->
  <polygon points="620,840 760,810 820,890 680,920" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
  <text x="730" y="870" fill="#713f12" font-family="monospace" font-size="18" font-weight="bold">捜査調書</text>
</svg>
