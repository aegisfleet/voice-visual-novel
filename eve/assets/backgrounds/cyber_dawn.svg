<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="dawnBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c38"/>
      <stop offset="45%" stop-color="#343d68"/>
      <stop offset="75%" stop-color="#76607e"/>
      <stop offset="100%" stop-color="#ffb88c"/>
    </linearGradient>
    <linearGradient id="cityGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 230, 200, 0.4)"/>
      <stop offset="100%" stop-color="rgba(255, 230, 200, 0)"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#dawnBg)"/>

  <!-- Futuristic city skyline in dawn -->
  <polygon points="100,1080 100,680 180,680 220,620 280,620 320,680 340,1080" fill="#0d1424" opacity="0.8"/>
  <polygon points="360,1080 360,540 460,540 480,500 540,500 580,1080" fill="#121b2d" opacity="0.9"/>
  <polygon points="620,1080 620,420 680,360 740,420 780,1080" fill="#0b111e"/>
  
  <polygon points="850,1080 850,600 980,600 1020,1080" fill="#121b2d" opacity="0.85"/>
  <polygon points="1060,1080 1060,460 1120,400 1200,400 1260,1080" fill="#0b111e"/>
  <polygon points="1320,1080 1320,520 1440,520 1500,1080" fill="#152136" opacity="0.8"/>
  <polygon points="1550,1080 1550,650 1680,650 1720,1080" fill="#0e1726" opacity="0.9"/>

  <!-- Morning Sun/Horizon glow -->
  <ellipse cx="960" cy="1080" rx="900" ry="250" fill="url(#cityGlow)"/>

  <!-- Clean window frame of the investigation agency -->
  <rect x="0" y="0" width="1920" height="40" fill="#1b2438"/>
  <rect x="0" y="1040" width="1920" height="40" fill="#1b2438"/>
  <rect x="0" y="0" width="40" height="1080" fill="#1b2438"/>
  <rect x="1880" y="0" width="40" height="1080" fill="#1b2438"/>
  <line x1="960" y1="0" x2="960" y2="1080" stroke="#1b2438" stroke-width="20"/>
</svg>
